[project]
name = "voicedesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omkar", email = "omkaranarse1906@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "livekit>=1.1.18",
    "livekit-agents[openai,silero]~=1.5",
    "openai>=2.54.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
voicedesk = "voicedesk:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
